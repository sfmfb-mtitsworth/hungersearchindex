name: Refresh dashboard data

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests google-auth

      # token.json carries client_id, client_secret and refresh_token, so it is
      # the only real credential. The scripts open .env at import, so it must exist.
      - name: Write credentials
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$TOKEN_JSON" > token.json
          touch .env

      - run: python scripts/fetch_monthly_all.py

      - run: python scripts/embed_data.py

      - name: Remove credentials
        if: always()
        run: rm -f token.json .env

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/food_bank_trends_california_dma_monthly.csv
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh trends data"
          git push
